[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-sim"
dynamic = ["version"]
description = "Differentiable photon simulation for optical particle detectors"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.8.0",
    "optax>=0.1.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "tqdm>=4.60",
    "plotly>=5.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "uproot>=5.0",
]

[project.optional-dependencies]
training = ["torch>=2.0"]
dev = ["pytest>=7.0", "nbmake"]

[project.scripts]
lucid-optimize = "lucid.optimization.run:main"
lucid-train-siren = "lucid.siren.train:main"
lucid-run-job = "lucid.production.run_job:main"

[tool.setuptools.packages.find]
include = ["lucid*"]

[tool.pytest.ini_options]
markers = [
    "slow: full simulation with JIT compilation (30s+)",
]

[tool.setuptools_scm]
