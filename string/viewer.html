<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IceCube-86 Event Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060610; color: #bbb; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
#container { width: 100vw; height: 100vh; }
#controls {
  position: absolute; top: 10px; left: 10px; z-index: 10;
  background: rgba(6,6,18,0.9); padding: 12px 16px; border-radius: 8px;
  min-width: 260px; font-size: 12px; backdrop-filter: blur(6px);
}
#controls h3 { color: #6af; margin-bottom: 6px; font-size: 14px; }
label { display: block; margin: 4px 0 1px; color: #667; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.6px; }
select { width: 100%; background: #12122a; color: #aaa; border: 1px solid #223;
  padding: 3px; border-radius: 3px; font-size: 11px; }
input[type=range] { width: 100%; accent-color: #4488cc; }
.info { margin-top: 6px; line-height: 1.5; font-size: 10px; color: #556; }
.info span { color: #99a; }
.row { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 3px; }
.row button {
  padding: 3px 7px; background: #12122a; color: #789;
  border: 1px solid #223; border-radius: 3px; cursor: pointer; font-size: 10px;
}
.row button:hover { background: #1e1e3a; color: #acd; }
.row button.on { border-color: #4488cc; color: #8bf; }
#timeBar { margin-top: 5px; padding: 3px 6px; background: rgba(0,0,0,0.5); border-radius: 3px;
  font-family: monospace; font-size: 12px; color: #aa8; }
.sep { border: 0; border-top: 1px solid #181828; margin: 7px 0; }
#gifProg { display: none; margin-top: 3px; color: #aa8; font-size: 10px; }
#cbarBox {
  position: absolute; bottom: 14px; right: 14px; z-index: 10;
  background: rgba(6,6,18,0.9); padding: 6px; border-radius: 5px;
  font-size: 10px; text-align: center; color: #556;
}
#cbarBox canvas { display: block; margin: 2px 0; }
</style>
</head>
<body>
<div id="container"></div>
<div id="controls">
  <h3>IceCube-86</h3>
  <label>Event</label><select id="evSel"></select>
  <label>Point size</label><input type="range" id="ptSz" min="0.3" max="5" step="0.1" value="1.2">
  <label>Emphasis</label><input type="range" id="emph" min="0.1" max="2" step="0.05" value="0.5">
  <div class="row">
    <button id="bStr" class="on">Strings</button>
    <button id="bUnh" class="on">Unhit</button>
    <button id="bTrk" class="on">Track</button>
  </div>
  <hr class="sep">
  <div class="row">
    <button id="bPlay">&#9654;</button>
    <button id="bPause">&#10074;&#10074;</button>
    <button id="bReset">Reset</button>
    <button id="bHardReset">&#8634; Full Reset</button>
    <button id="bGif">GIF</button>
  </div>
  <label>Speed</label><input type="range" id="spd" min="0.1" max="5" step="0.1" value="1">
  <span id="spdV" style="color:#556">1.0x</span>
  <div id="timeBar">t = 0 ns</div>
  <div id="gifProg"></div>
  <div class="info" id="info">Loading...</div>
</div>
<div id="cbarBox">
  <div>log₁₀(Q)</div>
  <canvas id="cbar" width="14" height="100"></canvas>
  <div id="cbMin">0</div><div id="cbMax">1</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, ctrl;
let det = null, evs = null;
let strGrp, unhitPts = null, hitMesh = null;
let trackGeo = null, trackMat = null, trackLine = null, trackDot = null;
let showStr = true, showUnh = true, showTrk = true;
let anim = false, animT = 0, tMin = 0, tMax = 1000, lastT = 0;
let initCamPos = null, initCamTarget = null;

const C_MUON = 0.2998;  // m/ns (speed of light)
const DIR = '../output/siren_tracks/';

// ── Inferno-like colormap ──
function infernoRGB(t) {
  t = Math.max(0, Math.min(1, t));
  const s = [[0,[3,3,10]],[.13,[40,10,60]],[.27,[100,15,100]],[.4,[155,30,80]],
    [.55,[200,60,40]],[.7,[230,120,15]],[.82,[245,180,10]],[.92,[250,225,60]],[1,[252,252,165]]];
  for (let i = 0; i < s.length-1; i++) {
    const [t0,c0]=s[i],[t1,c1]=s[i+1];
    if (t<=t1) { const f=(t-t0)/(t1-t0);
      return [c0[0]+f*(c1[0]-c0[0]),c0[1]+f*(c1[1]-c0[1]),c0[2]+f*(c1[2]-c0[2])]; }
  }
  return s[s.length-1][1];
}

function mkCmap() {
  const w=256, d=new Uint8Array(w*4);
  for(let i=0;i<w;i++){const c=infernoRGB(i/(w-1));d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;}
  const t=new THREE.DataTexture(d,w,1,THREE.RGBAFormat); t.needsUpdate=true; return t;
}

// ── Shaders ──
const VS = `
attribute float qN;
attribute float hT;
uniform float ptSz, empP, aT, aOn, tRng;
varying float vN, vA, vFl;
void main(){
  vN = qN;
  float em = pow(max(qN,0.001), empP);
  vA = 0.03 + 0.7 * em;
  float sz = (0.8 + qN * 3.5) * ptSz;
  vFl = 0.0;
  if(aOn > 0.5){
    float dt = aT - hT;
    float fw = tRng * 0.08;
    float arrive = smoothstep(-fw*0.2, fw*0.1, dt);
    float flash = (1.0 - smoothstep(0.0, fw*1.5, dt)) * 0.3;
    vA *= arrive;
    sz *= mix(1.0, 1.15, flash * arrive);
    vFl = flash * arrive;
    if(dt < -fw*0.4){ vA=0.0; sz=0.0; }
  }
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
  gl_PointSize = sz;
}`;

const FS = `
uniform sampler2D cm;
varying float vN, vA, vFl;
void main(){
  vec2 d = gl_PointCoord - vec2(0.5);
  float r = length(d);
  if(r>0.5) discard;
  float edge = 1.0 - smoothstep(0.32, 0.5, r);
  vec3 c = texture2D(cm, vec2(clamp(vN,0.01,0.99), 0.5)).rgb;
  c += vec3(vFl * 0.4, vFl * 0.3, vFl * 0.15);
  gl_FragColor = vec4(c, vA * edge);
}`;

async function loadData() {
  const [dr,er] = await Promise.all([fetch(DIR+'detector.json'),fetch(DIR+'events.json')]);
  det = await dr.json(); evs = await er.json();
  const sel = document.getElementById('evSel');
  evs.forEach((e,i)=>{const o=document.createElement('option');o.value=i;
    o.text=`${i}: ${e.n_doms_hit} DOMs`;sel.appendChild(o);});
}

function init() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x060610);
  camera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,1,6000);
  camera.position.set(1000,500,600); camera.up.set(0,0,1);
  renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(devicePixelRatio);
  document.getElementById('container').appendChild(renderer.domElement);
  ctrl = new OrbitControls(camera,renderer.domElement);
  ctrl.enableDamping=true; ctrl.target.set(0,0,-1950);
  scene.add(new THREE.AmbientLight(0x202040,0.8));
  initCamPos = camera.position.clone(); initCamTarget = ctrl.target.clone();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}

function buildDet() {
  strGrp = new THREE.Group();
  const sm = new THREE.LineBasicMaterial({color:0x101828,transparent:true,opacity:0.18});
  for(let i=0;i<det.n_str;i++){
    const a=det.string_anchors[i],t=det.string_tops[i];
    strGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a[0],a[1],a[2]),new THREE.Vector3(t[0],t[1],t[2])]),sm));
  }
  scene.add(strGrp);

  const p=new Float32Array(det.n_sensors*3);
  for(let i=0;i<det.n_sensors;i++){p[i*3]=det.dom_positions[i][0];p[i*3+1]=det.dom_positions[i][1];p[i*3+2]=det.dom_positions[i][2];}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  unhitPts=new THREE.Points(g,new THREE.PointsMaterial({color:0x0e1420,size:1,sizeAttenuation:false,transparent:true,opacity:0.1}));
  scene.add(unhitPts);
}

function clearHits(){
  if(hitMesh){scene.remove(hitMesh);hitMesh.geometry.dispose();hitMesh.material.dispose();hitMesh=null;}
  if(trackLine){scene.remove(trackLine);trackLine=null;}
  if(trackDot){scene.remove(trackDot);trackDot=null;}
  trackGeo=null; trackMat=null;
}

function showEvent(idx){
  clearHits(); anim=false; animT=0;
  const ev=evs[idx]; if(!ev||!ev.hit_dom_ids.length) return;
  const hasT = ev.hit_times_ns && ev.hit_times_ns.length>0;
  const hits = ev.hit_dom_ids.map((id,i)=>({id,q:ev.hit_charges[i],
    t:hasT?Math.max(ev.hit_times_ns[i],0):0})).filter(h=>h.q>1e-8);
  if(!hits.length) return;

  const lqs=hits.map(h=>Math.log10(Math.max(h.q,1e-10)));
  const lMin=Math.min(...lqs),lMax=Math.max(...lqs);
  const vt=hits.map(h=>h.t).filter(t=>isFinite(t)&&t>=0);
  tMin=vt.length?Math.min(...vt):0; tMax=vt.length?Math.max(...vt):1000;

  const n=hits.length, pos=new Float32Array(n*3), qN=new Float32Array(n), hT=new Float32Array(n);
  hits.forEach((h,i)=>{const p=det.dom_positions[h.id];
    pos[i*3]=p[0];pos[i*3+1]=p[1];pos[i*3+2]=p[2];
    qN[i]=(Math.log10(Math.max(h.q,1e-10))-lMin)/(lMax-lMin+1e-10);
    hT[i]=h.t;});

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('qN',new THREE.BufferAttribute(qN,1));
  geo.setAttribute('hT',new THREE.BufferAttribute(hT,1));
  hitMesh=new THREE.Points(geo,new THREE.ShaderMaterial({
    vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,
    blending:THREE.AdditiveBlending,
    uniforms:{cm:{value:mkCmap()},ptSz:{value:+$('ptSz').value},
      empP:{value:+$('emph').value},aT:{value:tMin},aOn:{value:0},tRng:{value:tMax-tMin}}}));
  scene.add(hitMesh);

  // Track (will be updated dynamically)
  const o=ev.track_origin, d=ev.track_direction;
  // Full track line (always visible when not animating)
  const tStart = -20, tEnd = TRACK_LEN;
  trackMat = new THREE.LineBasicMaterial({color:0xcc4433,transparent:true,opacity:0.3});
  trackGeo = new THREE.BufferGeometry();
  const tp = new Float32Array(6);
  tp[0]=o[0]+d[0]*tStart; tp[1]=o[1]+d[1]*tStart; tp[2]=o[2]+d[2]*tStart;
  tp[3]=o[0]+d[0]*tEnd;   tp[4]=o[1]+d[1]*tEnd;   tp[5]=o[2]+d[2]*tEnd;
  trackGeo.setAttribute('position',new THREE.BufferAttribute(tp,3));
  trackLine = new THREE.Line(trackGeo,trackMat);
  trackLine.visible = showTrk;
  scene.add(trackLine);

  const dg=new THREE.SphereGeometry(2.5,8,6);
  trackDot=new THREE.Mesh(dg,new THREE.MeshBasicMaterial({color:0xff5544,transparent:true,opacity:0.6}));
  trackDot.visible=false; scene.add(trackDot);

  drawCbar(lMin,lMax);
  $('info').innerHTML=`Ev <span>${idx}</span> | <span>${hits.length}</span> DOMs | Q <span>${ev.total_charge.toFixed(0)}</span> | ${((tMax-tMin)).toFixed(0)} ns`;
  updTime();
}

function $(id){return document.getElementById(id);}

function drawCbar(mn,mx){
  const c=$('cbar'),x=c.getContext('2d');
  for(let y=0;y<c.height;y++){const t=1-y/c.height,rgb=infernoRGB(t);
    x.fillStyle=`rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;x.fillRect(0,y,c.width,1);}
  $('cbMin').textContent=mn.toFixed(1); $('cbMax').textContent=mx.toFixed(1);
}

function updTime(){$('timeBar').textContent=`t = ${animT.toFixed(0)} ns`;}

const TRACK_LEN = 300; // meters — physical emission length (F=30 × ~10m SIREN range)

function updTrack(t, isAnimating){
  if(!trackLine||!trackGeo) return;
  const ev=evs[+$('evSel').value]; if(!ev) return;
  const o=ev.track_origin, d=ev.track_direction;
  const pa = trackGeo.attributes.position.array;
  const startS = -20;

  if(!isAnimating){
    // Static: show full track
    pa[0]=o[0]+d[0]*startS; pa[1]=o[1]+d[1]*startS; pa[2]=o[2]+d[2]*startS;
    pa[3]=o[0]+d[0]*TRACK_LEN; pa[4]=o[1]+d[1]*TRACK_LEN; pa[5]=o[2]+d[2]*TRACK_LEN;
    trackGeo.attributes.position.needsUpdate=true;
    if(trackDot) trackDot.visible=false;
    return;
  }

  // Animating: line grows from start to muon front
  const tTravel = TRACK_LEN / C_MUON;
  const frac = Math.max(0, Math.min(1, (t - tMin) / tTravel));
  const frontS = startS + frac * (TRACK_LEN - startS);

  pa[0]=o[0]+d[0]*startS;  pa[1]=o[1]+d[1]*startS;  pa[2]=o[2]+d[2]*startS;
  pa[3]=o[0]+d[0]*frontS; pa[4]=o[1]+d[1]*frontS; pa[5]=o[2]+d[2]*frontS;
  trackGeo.attributes.position.needsUpdate=true;

  if(trackDot){
    trackDot.position.set(o[0]+d[0]*frontS, o[1]+d[1]*frontS, o[2]+d[2]*frontS);
    trackDot.visible = showTrk && frac < 1.0;
  }
}

function tick(ts){
  requestAnimationFrame(tick);
  const dt=lastT?(ts-lastT)/1000:0; lastT=ts;
  if(hitMesh){
    const u=hitMesh.material.uniforms;
    u.ptSz.value=+$('ptSz').value; u.empP.value=+$('emph').value;
    if(anim){
      u.aOn.value=1;
      const spd=+$('spd').value, nsps=(tMax-tMin)*0.22*spd;
      animT+=dt*nsps;
      if(animT>tMax+(tMax-tMin)*0.12) animT=tMin-(tMax-tMin)*0.06;
      u.aT.value=animT;
      updTrack(animT, true);
      ctrl.autoRotate=true; ctrl.autoRotateSpeed=0.3;
    } else {
      u.aOn.value=0;
      updTrack(0, false);
      ctrl.autoRotate=false;
    }
  }
  ctrl.update(); updTime();
  renderer.render(scene,camera);
}

// ── GIF ──
function exportGif(){
  const pr=$('gifProg'); pr.style.display='block'; pr.textContent='Capturing...';
  const w=640,h=480;
  const gr=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});gr.setSize(w,h);
  const gc=camera.clone();gc.aspect=w/h;gc.updateProjectionMatrix();
  const gif=new GIF({workers:2,quality:8,width:w,height:h,
    workerScript:'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'});
  const nF=90, totT=(tMax-tMin)*1.25, dt=totT/nF;
  let t=tMin-(tMax-tMin)*0.06;
  if(hitMesh) hitMesh.material.uniforms.aOn.value=1;
  const baseAngle=Math.atan2(camera.position.y-ctrl.target.y,camera.position.x-ctrl.target.x);
  const camR=Math.sqrt((camera.position.x-ctrl.target.x)**2+(camera.position.y-ctrl.target.y)**2);
  const camZ=camera.position.z;
  for(let f=0;f<nF;f++){
    if(hitMesh) hitMesh.material.uniforms.aT.value=t;
    updTrack(t, true);
    const ang=baseAngle+(f/nF)*Math.PI*0.4;
    gc.position.set(ctrl.target.x+camR*Math.cos(ang),ctrl.target.y+camR*Math.sin(ang),camZ);
    gc.lookAt(ctrl.target);
    gr.render(scene,gc);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(gr.domElement,0,0);
    gif.addFrame(cv,{delay:70}); t+=dt;
    pr.textContent=`${f+1}/${nF}`;
  }
  gif.on('finished',blob=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`icecube_ev${$('evSel').value}.gif`;a.click();
    pr.textContent='Saved!'; setTimeout(()=>pr.style.display='none',2000);gr.dispose();
  });
  pr.textContent='Encoding...'; gif.render();
}

// ── Controls ──
$('evSel').onchange=e=>showEvent(+e.target.value);
$('bStr').onclick=e=>{showStr=!showStr;strGrp.visible=showStr;e.target.classList.toggle('on');};
$('bUnh').onclick=e=>{showUnh=!showUnh;if(unhitPts)unhitPts.visible=showUnh;e.target.classList.toggle('on');};
$('bTrk').onclick=e=>{showTrk=!showTrk;if(trackLine)trackLine.visible=showTrk;
  if(trackDot)trackDot.visible=showTrk&&anim;e.target.classList.toggle('on');};
$('bPlay').onclick=()=>{anim=true;if(animT>=tMax)animT=tMin;};
$('bPause').onclick=()=>{anim=false;};
$('bReset').onclick=()=>{anim=false;animT=tMin-(tMax-tMin)*0.06;
  if(hitMesh)hitMesh.material.uniforms.aOn.value=0;if(trackDot)trackDot.visible=false;updTime();};
$('bHardReset').onclick=()=>{
  anim=false; animT=0;
  if(hitMesh)hitMesh.material.uniforms.aOn.value=0;
  if(trackDot)trackDot.visible=false;
  camera.position.copy(initCamPos); ctrl.target.copy(initCamTarget);
  ctrl.autoRotate=false; ctrl.update();
  $('ptSz').value=1.2; $('emph').value=0.5; $('spd').value=1;
  $('spdV').textContent='1.0x';
  showEvent(+$('evSel').value);
};
$('bGif').onclick=exportGif;
$('spd').oninput=e=>{$('spdV').textContent=(+e.target.value).toFixed(1)+'x';};

async function start(){init();await loadData();buildDet();showEvent(0);tick(0);}
start();
</script>
</body>
</html>
