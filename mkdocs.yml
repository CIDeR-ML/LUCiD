site_name: LUCiD
site_description: Differentiable photon simulation for optical particle detectors
site_url: https://cider-ml.github.io/LUCiD/docs/
repo_url: https://github.com/CIDeR-ML/LUCiD
repo_name: CIDeR-ML/LUCiD
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search

# Clicking the logo/title returns to the project landing page (site root),
# not the docs home, since the docs are served beneath it at /docs/.
extra:
  homepage: https://cider-ml.github.io/LUCiD/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  # Code on a page is included from the file it runs in (examples/), so it cannot drift.
  - pymdownx.snippets: { base_path: ['.'], check_paths: true, dedent_subsections: true }
  - pymdownx.arithmatex: { generic: true }
  - tables
  - toc: { permalink: true }

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Bundled detectors: getting-started/detectors.md
  - Guides:
      - Model your own detector: guides/model-your-own-detector.md
      - Reconstruction: guides/reconstruction.md
      - Calibration: guides/calibration.md
      - Paper figures: guides/paper.md
  - Producing datasets:
      - Overview: guides/production/index.md
      - On your machine: guides/production/local.md
      - From the container: guides/production/container.md
      - On a cluster (S3DF, NERSC, LXPLUS): guides/production/clusters.md
      - How cluster targeting works: guides/production/cluster-abstraction.md
      - Training a SIREN emitter: guides/production/siren-training-inputs.md
  - Concepts:
      - How the simulator works: concepts/architecture.md
      - "Optics: media and wavelength": concepts/optics.md
  - Reference:
      - Simulator: reference/simulator.md
      - Parameters: reference/detector-params.md
      - Configuration files: reference/config.md
      - Command-line tools: reference/cli.md
      - Dataset schema: reference/dataset-schema.md
      - Digitizer and trigger: reference/digitizer-and-trigger.md
      - Sensor position files: reference/pmt-npz-schema.md
  - Development:
      - Development: development.md
      - Studies and archives: studies.md
