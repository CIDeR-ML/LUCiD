name: Visual smoke (dataprod_01)

# Runs after `Build and push lucid container` completes successfully on
# main or production-interm. Pulls the image tagged with the built SHA,
# runs the production pipeline on dataprod_01 for 3 muon events, renders
# per-event PE and first-hit-time displays on the detector unwrap, and
# uploads the single PNG as a workflow artifact for visual inspection.
#
# This is a visual-only smoke: the workflow does not fail on physics
# thresholds, only on outright errors (dark events, missing files, etc.).
# A human reviewer eyeballs the uploaded PNG to spot regressions like
# C-shape rings, missing caps, or other suspicious geometric artifacts.

on:
  workflow_run:
    workflows: ["Build and push lucid container"]
    types: [completed]

jobs:
  smoke:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'production-interm')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag from the build that triggered this run
        id: img
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cider-ml/lucid:$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull LUCiD container
        run: docker pull ${{ steps.img.outputs.image }}

      - name: Run dataprod_01 (3 muon events) and render Q + T displays
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/out:/out" \
            ${{ steps.img.outputs.image }} \
            bash -c "
              set -euo pipefail &&
              python3 /opt/LUCiD/lucid/production/run_job.py \
                --config /opt/LUCiD/lucid/production/configs/dataprod_01_mu.json \
                --n-events 3 \
                --job-id 1 \
                --master-seed 42 \
                --output-dir /out &&
              python3 /opt/LUCiD/ci_tests/render_ci_displays.py \
                --output-dir /out \
                --geom-config /opt/LUCiD/config/SK_like_geom_config.json \
                --out-png /out/dataprod_01_visual_smoke.png \
                --label '${{ steps.img.outputs.short }} (${{ github.event.workflow_run.head_branch }})'
            "

      - name: Upload Q + T displays as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataprod_01_visual_smoke-${{ steps.img.outputs.short }}
          path: out/dataprod_01_visual_smoke.png
          retention-days: 90
          if-no-files-found: error
