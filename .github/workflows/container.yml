name: Build and push lucid container

on:
  push:
    branches: [main, production-interm]
    paths:
      - 'container/**'
      - 'lucid/**'
      - 'pyproject.toml'
      - '.github/workflows/container.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout LUCiD
        uses: actions/checkout@v4
        with:
          path: LUCiD

      - name: Clone PhotonSim sibling
        run: git clone --depth 1 https://github.com/cesarjesusvalls/PhotonSim.git PhotonSim

      - name: Set up QEMU (linux/amd64 under arm64 runners if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: LUCiD/container/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/cider-ml/lucid:latest
            ghcr.io/cider-ml/lucid:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
