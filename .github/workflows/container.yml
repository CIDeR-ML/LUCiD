name: Build and push lucid container

# Images are built for release tags only (v*), plus by hand. Publishing a GitHub release
# pushes its tag, so a release builds once, from the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      photonsim_ref:
        description: 'PhotonSim ref (tag or SHA) to build against'
        required: false
        default: ''

# PhotonSim is a separate repo, so the image must pin it explicitly: cloning
# main would make the C++ half of any release whatever happened to be on main
# that day, unrecorded. Bump deliberately, alongside a LUCiD change that needs it.
env:
  PHOTONSIM_REF_DEFAULT: v1.0.3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout LUCiD
        uses: actions/checkout@v4
        with:
          path: LUCiD

      - name: Clone PhotonSim at the pinned ref
        run: |
          REF="${{ github.event.inputs.photonsim_ref }}"
          [ -n "$REF" ] || REF="${{ env.PHOTONSIM_REF_DEFAULT }}"
          git clone https://github.com/cesarjesusvalls/PhotonSim.git PhotonSim
          git -C PhotonSim checkout --detach "$REF"
          echo "PHOTONSIM_REF=$REF" >> "$GITHUB_ENV"
          echo "PHOTONSIM_SHA=$(git -C PhotonSim rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # tracked changes in the LUCiD build context (a fresh checkout has none)
          if [ -n "$(git -C LUCiD status --porcelain --untracked-files=no)" ]; then
            echo "LUCID_DIRTY=true" >> "$GITHUB_ENV"
          else
            echo "LUCID_DIRTY=false" >> "$GITHUB_ENV"
          fi
          git -C PhotonSim log --oneline -1

      - name: Resolve the version tag (tag pushes only)
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            {
              echo "extra<<EOF"
              echo "ghcr.io/cider-ml/lucid:${{ github.ref_name }}"
              echo "ghcr.io/cider-ml/lucid:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (linux/amd64 under arm64 runners if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: LUCiD/container/Dockerfile
          platforms: linux/amd64
          push: true
          # An SBOM is the only inventory anyone will ever have of this image's
          # base layers. THIRD_PARTY.md §3 lists what they are -- ROOT, GENIE
          # 3.04 + splines, Pythia6, NUISANCE, NEUT, NuWro, LHAPDF -- and the
          # strictest of those terms are not freely redistributable, so an
          # image that ships them with no manifest is an exposure nobody can
          # even measure. provenance stays off: it is a build-attestation
          # format, not a licence inventory, and it breaks some pullers.
          provenance: false
          sbom: true
          # latest moves only with a release tag; a manual build is tagged by its commit alone.
          tags: |
            ghcr.io/cider-ml/lucid:${{ github.sha }}
            ${{ steps.ver.outputs.extra }}
          build-args: |
            LUCID_SHA=${{ github.sha }}
            LUCID_DIRTY=${{ env.LUCID_DIRTY }}
            PHOTONSIM_SHA=${{ env.PHOTONSIM_SHA }}
            PHOTONSIM_REF=${{ env.PHOTONSIM_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  speed:
    # Diagnostic pipeline speed test: speed_test.py's default configs (one mu,
    # one low-E electron) at N=20. Always succeeds unless the harness
    # blows up; compare JSON / MD across commits to spot regressions.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          SHA="${{ github.sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cider-ml/lucid:$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull LUCiD container
        run: docker pull ${{ steps.img.outputs.image }}

      - name: Run pipeline speed test
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/out:/out" \
            -e GENIE_XSEC_FILE=/opt/genie_xsec/3_04_00/G18_10a_02_11b/gxspl-min.xml.gz \
            ${{ steps.img.outputs.image }} \
            python3 /opt/LUCiD/ci_tests/speed_test.py \
              --n-events 20 \
              --out-json /out/speed.json \
              --out-md   /out/speed.md

      - name: Upload speed-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: speed_test-${{ steps.img.outputs.short }}
          path: |
            out/speed.json
            out/speed.md
          retention-days: 90
          if-no-files-found: error

  test:
    # The image smoke test: the default lane inside the built container, so a dependency
    # the image lacks shows up here. The slow lane runs once per push, in ci.yml
    # `integration`; running it again here doubled the longest job for no new coverage.
    #
    # conftest.py forces JAX_PLATFORMS=cpu for the whole suite, so a GPU runner would not help.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          SHA="${{ github.sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cider-ml/lucid:$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull LUCiD container
        run: docker pull ${{ steps.img.outputs.image }}

      # -rs lists every skip with its reason, so a gate that silently stopped running shows up.
      # Expected skips here: every test marked requires_data or requires_emitter (tests/conftest.py
      # names what each one needs), because container/Dockerfile.dockerignore excludes the
      # downloaded data/ files, and the shellcheck tests when the image has no shellcheck.
      - name: Run pytest (default lane)
        run: |
          docker run --rm \
            ${{ steps.img.outputs.image }} \
            bash -c "cd /opt/LUCiD && python3 -m pytest tests/ -q --tb=short -rs"
