name: Build and push lucid container

on:
  push:
    branches: [main, refactor-v2]
    paths:
      - 'container/**'
      - 'lucid/**'
      - 'pyproject.toml'
      - '.github/workflows/container.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout LUCiD
        uses: actions/checkout@v4
        with:
          path: LUCiD

      - name: Clone PhotonSim sibling
        run: git clone --depth 1 https://github.com/cesarjesusvalls/PhotonSim.git PhotonSim

      - name: Set up QEMU (linux/amd64 under arm64 runners if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: LUCiD/container/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/cider-ml/lucid:latest
            ghcr.io/cider-ml/lucid:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  speed:
    # Diagnostic pipeline speed test: one mu, one low-E electron, one
    # GENIE numu config at N=20. Always succeeds unless the harness
    # blows up; compare JSON / MD across commits to spot regressions.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          SHA="${{ github.sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cider-ml/lucid:$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull LUCiD container
        run: docker pull ${{ steps.img.outputs.image }}

      - name: Run pipeline speed test
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/out:/out" \
            -e GENIE_XSEC_FILE=/opt/genie_xsec/3_04_00/G18_10a_02_11b/gxspl-min.xml.gz \
            ${{ steps.img.outputs.image }} \
            python3 /opt/LUCiD/ci_tests/speed_test.py \
              --n-events 20 \
              --out-json /out/speed.json \
              --out-md   /out/speed.md

      - name: Upload speed-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: speed_test-${{ steps.img.outputs.short }}
          path: |
            out/speed.json
            out/speed.md
          retention-days: 90
          if-no-files-found: error

  test:
    # Unit / integration tests: runs the pytest suite (fast tests only;
    # slow tests are skipped by default via conftest.py --slow mechanism).
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          SHA="${{ github.sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cider-ml/lucid:$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull LUCiD container
        run: docker pull ${{ steps.img.outputs.image }}

      - name: Run pytest
        run: |
          docker run --rm \
            ${{ steps.img.outputs.image }} \
            bash -c "cd /opt/LUCiD && python3 -m pytest tests/ -v --tb=short"
