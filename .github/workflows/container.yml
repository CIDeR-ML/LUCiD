name: Build and push lucid container

on:
  push:
    branches: [main, refactor-v2]
    paths:
      - 'container/**'
      - 'lucid/**'
      - 'pyproject.toml'
      - '.github/workflows/container.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      photonsim_ref:
        description: 'PhotonSim ref (tag or SHA) to build against'
        required: false
        default: ''

# PhotonSim is a separate repo, so the image must pin it explicitly: cloning
# main would make the C++ half of any release whatever happened to be on main
# that day, unrecorded. Bump deliberately, alongside a LUCiD change that needs it.
env:
  PHOTONSIM_REF_DEFAULT: v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout LUCiD
        uses: actions/checkout@v4
        with:
          path: LUCiD

      - name: Clone PhotonSim at the pinned ref
        run: |
          REF="${{ github.event.inputs.photonsim_ref }}"
          [ -n "$REF" ] || REF="${{ env.PHOTONSIM_REF_DEFAULT }}"
          git clone https://github.com/cesarjesusvalls/PhotonSim.git PhotonSim
          git -C PhotonSim checkout --detach "$REF"
          echo "PHOTONSIM_REF=$REF" >> "$GITHUB_ENV"
          echo "PHOTONSIM_SHA=$(git -C PhotonSim rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          git -C PhotonSim log --oneline -1

      - name: Resolve the version tag (releases only)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "extra=ghcr.io/cider-ml/lucid:${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (linux/amd64 under arm64 runners if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: LUCiD/container/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/cider-ml/lucid:latest
            ghcr.io/cider-ml/lucid:${{ github.sha }}
            ${{ steps.ver.outputs.extra }}
          build-args: |
            LUCID_SHA=${{ github.sha }}
            PHOTONSIM_SHA=${{ env.PHOTONSIM_SHA }}
            PHOTONSIM_REF=${{ env.PHOTONSIM_REF }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  speed:
    # Diagnostic pipeline speed test: one mu, one low-E electron, one
    # GENIE numu config at N=20. Always succeeds unless the harness
    # blows up; compare JSON / MD across commits to spot regressions.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          SHA="${{ github.sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cider-ml/lucid:$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull LUCiD container
        run: docker pull ${{ steps.img.outputs.image }}

      - name: Run pipeline speed test
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/out:/out" \
            -e GENIE_XSEC_FILE=/opt/genie_xsec/3_04_00/G18_10a_02_11b/gxspl-min.xml.gz \
            ${{ steps.img.outputs.image }} \
            python3 /opt/LUCiD/ci_tests/speed_test.py \
              --n-events 20 \
              --out-json /out/speed.json \
              --out-md   /out/speed.md

      - name: Upload speed-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: speed_test-${{ steps.img.outputs.short }}
          path: |
            out/speed.json
            out/speed.md
          retention-days: 90
          if-no-files-found: error

  test:
    # The WHOLE suite, --slow included.
    #
    # It used to be the fast tests only. conftest.py's pytest_ignore_collect drops 23 files
    # unless --slow is passed, so those 23 never ran here, and this repo has now paid for that
    # twice over with defects that sat red for months in a green pipeline:
    #
    #   * tests/test_containers.py asserted a value 968d11e changed on 2026-06-14. Red for three
    #     months.
    #   * tests/reconciliation/test_tripwire.py — the one instrument built to catch forward-model
    #     drift — failed from b8c266e (2026-07-15) until 2026-09-23. Excluded from the only place
    #     it would have been checked automatically.
    #
    # Also unrun in that set: the SK-scale integration tests and the propagation differentiability
    # gates. Cheaper to pay the wall-clock than to keep discovering which gates were never running.
    #
    # Provenance for the tripwire's reference: tests/reconciliation/tripwire_water_ref.PROVENANCE.md
    #
    # Cost: roughly 20-25 minutes on CPU when last measured. conftest.py forces JAX_PLATFORMS=cpu
    # for the whole suite, so a GPU on the runner would go unused.
    # This runner will differ by CPU model and core count, not by device. If it becomes the
    # bottleneck, split the job rather than narrowing what it collects.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          SHA="${{ github.sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/cider-ml/lucid:$SHA" >> "$GITHUB_OUTPUT"

      - name: Pull LUCiD container
        run: docker pull ${{ steps.img.outputs.image }}

      # -rs groups every skip with its reason. A bare skip count hides a gate that quietly stopped
      # running, and this suite already has skips nobody sees: the two byte-identity tests gate on
      # env vars CI never sets (the skipif on the ROOT-file variable in
      # tests/io/test_categorizer_byte_identity.py and tests/io/test_hits_byte_identity.py). The
      # SIREN-gated tests will skip here too, since container/Dockerfile.dockerignore excludes
      # **/siren_training/ and those paths are
      # symlinks into the data area, so they cannot be in the image. Naming a skip is what makes
      # that a decision rather than an assumption.
      - name: Run pytest (full suite, --slow)
        run: |
          docker run --rm \
            ${{ steps.img.outputs.image }} \
            bash -c "cd /opt/LUCiD && python3 -m pytest tests/ --slow -v --tb=short -rs"
